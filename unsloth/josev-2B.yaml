training:
  max_seq_length: 4096
  num_epochs: 2
  learning_rate: 0.0001
  embedding_learning_rate: null
  batch_size: 16
  gradient_accumulation_steps: 2
  warmup_steps: 5
  max_steps: 0
  save_steps: 30
  eval_steps: 0.1
  weight_decay: 0.01
  random_seed: 3407
  packing: false
  train_on_completions: false
  gradient_checkpointing: unsloth
  offload_layers: 0
  offload_vram_gb: null
  offload_vram_gb_per_device: {}
  prefetch_depth: 2
  optim: adamw_8bit
  lr_scheduler_type: linear
lora:
  lora_r: 64
  lora_alpha: 64
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false
  use_loftq: false
  use_dora: false
logging:
  enable_wandb: false
  wandb_project: decision-finetuning
  enable_tensorboard: false
  tensorboard_dir: runs
  log_frequency: 1
